# Spring TestContext reads this file from the test classpath root.
# Every cached ApplicationContext keeps its Hikari pool open (up to 10 connections) until it is
# evicted or the JVM exits. About a dozen distinct test configurations otherwise stay cached at
# once and exhaust the CI PostgreSQL budget (max_connections=100, superuser-reserved slots
# excluded). Bounding the LRU cache closes least-recently-used contexts and releases their
# pools, so adding a test configuration can no longer starve later contexts of connections.
spring.test.context.cache.maxSize=6
