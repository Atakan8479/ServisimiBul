# Fail closed when a production deployment omits required service configuration.
server.port=${SB_SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SB_SHUTDOWN_TIMEOUT:30s}
server.servlet.session.cookie.secure=true

# B-02 supplies the real identity service. Never create or log Boot's temporary generated user password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Spring Boot native ECS JSON keeps production logs machine-readable on stdout.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=production
logging.level.root=${SB_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=INFO

# SMTP credentials stay in the deployment secret store. Finite timeouts prevent stuck request threads.
spring.mail.host=${SB_SMTP_HOST}
spring.mail.port=${SB_SMTP_PORT:587}
spring.mail.username=${SB_SMTP_USERNAME}
spring.mail.password=${SB_SMTP_PASSWORD}
spring.mail.properties[mail.smtp.auth]=${SB_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SB_SMTP_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.starttls.required]=${SB_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties[mail.smtp.connectiontimeout]=${SB_SMTP_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtp.timeout]=${SB_SMTP_READ_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtp.writetimeout]=${SB_SMTP_WRITE_TIMEOUT_MS:5000}

# Production is same-origin. CORS is intentionally not enabled here.
server.forward-headers-strategy=${SB_FORWARD_HEADERS_STRATEGY:none}
