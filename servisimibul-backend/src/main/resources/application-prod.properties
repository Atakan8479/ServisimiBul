# Fail closed when a production deployment omits required service configuration.
server.port=${SB_SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SB_SHUTDOWN_TIMEOUT:30s}
server.servlet.session.cookie.secure=true
app.auth.email-verification.required=true

# The production web process cannot execute migrations or receive effective migration settings.
# Use the separate non-web migration profile for the reviewed one-shot job.
spring.flyway.enabled=false
spring.flyway.url=
spring.flyway.user=
spring.flyway.password=

# The application supplies database-backed identity. Never create or log Boot's temporary generated user password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Spring Boot native ECS JSON keeps production logs machine-readable on stdout.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=production
logging.level.root=${SB_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=INFO

# SMTP credentials stay in the deployment secret store. Reuse B-03's SB_MAIL_* contract.
# Finite timeouts prevent stuck request threads.
servisimibul.email.enabled=${SB_MAIL_ENABLED}
servisimibul.email.from=${SB_MAIL_FROM}
servisimibul.email.frontend-base-url=${SB_FRONTEND_BASE_URL}
spring.mail.host=${SB_MAIL_HOST}
spring.mail.port=${SB_MAIL_PORT:587}
spring.mail.username=${SB_MAIL_USERNAME}
spring.mail.password=${SB_MAIL_PASSWORD}
spring.mail.properties[mail.smtp.auth]=${SB_MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SB_MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.starttls.required]=${SB_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties[mail.smtp.connectiontimeout]=${SB_MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtp.timeout]=${SB_MAIL_READ_TIMEOUT_MS:5000}
spring.mail.properties[mail.smtp.writetimeout]=${SB_MAIL_WRITE_TIMEOUT_MS:5000}

# A production tariff API requires a mounted backend-only persistent volume.
servisimibul.tariff.storage-dir=${SB_TARIFF_STORAGE_DIR}

# Production is same-origin. CORS is intentionally not enabled here.
server.forward-headers-strategy=${SB_FORWARD_HEADERS_STRATEGY:none}
