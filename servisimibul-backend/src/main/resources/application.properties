spring.application.name=servisimibul-backend
spring.datasource.url=${SB_DB_JDBC_URL}
spring.datasource.username=${SB_DB_USER}
spring.datasource.password=${SB_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Email verification is fail-closed. The combined local launcher temporarily opts out for testing.
app.auth.email-verification.required=${SB_EMAIL_VERIFICATION_REQUIRED:true}

# Parent enrollment is always explicit. Email verification has its own safe default.
app.auth.parent-registration.enabled=${SB_PARENT_REGISTRATION_ENABLED:false}
app.auth.parent-email-verification.required=${SB_PARENT_EMAIL_VERIFICATION_REQUIRED:true}

# Administrative approval is fail-closed by default. The pilot must opt out explicitly.
app.operator-approval.required=${OPERATOR_APPROVAL_REQUIRED:true}

# Demand years are server-controlled so duplicate identity cannot be changed by clients.
app.demand.academic-year=${SB_DEMAND_ACADEMIC_YEAR:2026-2027}
app.demand.feedback.reminder-after-open=${SB_DEMAND_FEEDBACK_REMINDER_AFTER_OPEN:7d}
app.demand.feedback.expiry-after-open=${SB_DEMAND_FEEDBACK_EXPIRY_AFTER_OPEN:14d}
app.demand.feedback.expiry-if-unopened=${SB_DEMAND_FEEDBACK_EXPIRY_IF_UNOPENED:45d}
app.demand.feedback.batch-size=${SB_DEMAND_FEEDBACK_BATCH_SIZE:100}
app.demand.feedback.scheduler-enabled=${SB_DEMAND_FEEDBACK_SCHEDULER_ENABLED:true}
app.demand.feedback.scheduler-initial-delay=${SB_DEMAND_FEEDBACK_SCHEDULER_INITIAL_DELAY:1m}
app.demand.feedback.scheduler-interval=${SB_DEMAND_FEEDBACK_SCHEDULER_INTERVAL:15m}

# Single-instance, bounded in-memory rate limits. Existing authentication values are preserved.
app.rate-limit.capacity.max-keys=${SB_RATE_LIMIT_MAX_KEYS:10000}
app.rate-limit.capacity.overflow-buckets=${SB_RATE_LIMIT_OVERFLOW_BUCKETS:1024}
app.rate-limit.capacity.overflow-multiplier=${SB_RATE_LIMIT_OVERFLOW_MULTIPLIER:4}
app.rate-limit.login-account.requests=${SB_RATE_LIMIT_LOGIN_ACCOUNT_REQUESTS:10}
app.rate-limit.login-account.window=${SB_RATE_LIMIT_LOGIN_ACCOUNT_WINDOW:15m}
app.rate-limit.login-ip.requests=${SB_RATE_LIMIT_LOGIN_IP_REQUESTS:100}
app.rate-limit.login-ip.window=${SB_RATE_LIMIT_LOGIN_IP_WINDOW:15m}
app.rate-limit.registration-ip.requests=${SB_RATE_LIMIT_REGISTRATION_IP_REQUESTS:20}
app.rate-limit.registration-ip.window=${SB_RATE_LIMIT_REGISTRATION_IP_WINDOW:1h}
app.rate-limit.verification-resend-ip.requests=${SB_RATE_LIMIT_VERIFICATION_RESEND_IP_REQUESTS:20}
app.rate-limit.verification-resend-ip.window=${SB_RATE_LIMIT_VERIFICATION_RESEND_IP_WINDOW:1h}
app.rate-limit.verification-resend-account.requests=${SB_RATE_LIMIT_VERIFICATION_RESEND_ACCOUNT_REQUESTS:5}
app.rate-limit.verification-resend-account.window=${SB_RATE_LIMIT_VERIFICATION_RESEND_ACCOUNT_WINDOW:1h}
app.rate-limit.password-recovery-ip.requests=${SB_RATE_LIMIT_PASSWORD_RECOVERY_IP_REQUESTS:20}
app.rate-limit.password-recovery-ip.window=${SB_RATE_LIMIT_PASSWORD_RECOVERY_IP_WINDOW:1h}
app.rate-limit.password-recovery-account.requests=${SB_RATE_LIMIT_PASSWORD_RECOVERY_ACCOUNT_REQUESTS:5}
app.rate-limit.password-recovery-account.window=${SB_RATE_LIMIT_PASSWORD_RECOVERY_ACCOUNT_WINDOW:1h}
# Provisional defaults below require staging measurement before production sign-off.
app.rate-limit.email-verification-ip.requests=${SB_RATE_LIMIT_EMAIL_VERIFICATION_IP_REQUESTS:60}
app.rate-limit.email-verification-ip.window=${SB_RATE_LIMIT_EMAIL_VERIFICATION_IP_WINDOW:15m}
app.rate-limit.email-verification-token.requests=${SB_RATE_LIMIT_EMAIL_VERIFICATION_TOKEN_REQUESTS:5}
app.rate-limit.email-verification-token.window=${SB_RATE_LIMIT_EMAIL_VERIFICATION_TOKEN_WINDOW:15m}
app.rate-limit.password-reset-ip.requests=${SB_RATE_LIMIT_PASSWORD_RESET_IP_REQUESTS:30}
app.rate-limit.password-reset-ip.window=${SB_RATE_LIMIT_PASSWORD_RESET_IP_WINDOW:15m}
app.rate-limit.password-reset-token.requests=${SB_RATE_LIMIT_PASSWORD_RESET_TOKEN_REQUESTS:5}
app.rate-limit.password-reset-token.window=${SB_RATE_LIMIT_PASSWORD_RESET_TOKEN_WINDOW:15m}
app.rate-limit.public-search-ip.requests=${SB_RATE_LIMIT_PUBLIC_SEARCH_IP_REQUESTS:120}
app.rate-limit.public-search-ip.window=${SB_RATE_LIMIT_PUBLIC_SEARCH_IP_WINDOW:1m}
app.rate-limit.comment-account.requests=${SB_RATE_LIMIT_COMMENT_ACCOUNT_REQUESTS:5}
app.rate-limit.comment-account.window=${SB_RATE_LIMIT_COMMENT_ACCOUNT_WINDOW:10m}

# Server-side session schema is owned by Flyway V4.
spring.session.jdbc.initialize-schema=never

# Runtime starts without migration credentials. Enable Flyway only for a controlled migration run.
spring.flyway.enabled=${SB_FLYWAY_ENABLED:false}
spring.flyway.url=${SB_DB_MIGRATION_JDBC_URL:${SB_DB_JDBC_URL}}
spring.flyway.user=${SB_DB_MIGRATION_USER:}
spring.flyway.password=${SB_DB_MIGRATION_PASSWORD:}

# Session cookie defaults are secure. The explicit local profile is the only HTTP exception.
spring.session.timeout=30m
server.servlet.session.cookie.name=SBSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SB_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# Expose only status-only health probes. All diagnostic/configuration endpoints stay unavailable.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Keep JMX and verbose request logging off so configuration and credentials cannot become diagnostics.
spring.jmx.enabled=false
spring.mvc.log-request-details=false

# SMTP delivery is disabled until all SB_MAIL_* settings are deliberately configured.
servisimibul.email.enabled=${SB_MAIL_ENABLED:false}
servisimibul.email.from=${SB_MAIL_FROM:}
servisimibul.email.frontend-base-url=${SB_FRONTEND_BASE_URL:http://localhost:3000}
spring.mail.host=${SB_MAIL_HOST:localhost}
spring.mail.port=${SB_MAIL_PORT:587}
spring.mail.username=${SB_MAIL_USERNAME:}
spring.mail.password=${SB_MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${SB_MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SB_MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Official tariff files are disabled until a backend-only persistent directory is configured.
servisimibul.tariff.storage-dir=${SB_TARIFF_STORAGE_DIR:}

# One-shot admin bootstrap; run with web-application-type=none and temporary credentials.
servisimibul.admin-bootstrap.enabled=${SB_ADMIN_BOOTSTRAP_ENABLED:false}
servisimibul.admin-bootstrap.first-email=${SB_ADMIN_1_EMAIL:}
servisimibul.admin-bootstrap.first-password=${SB_ADMIN_1_PASSWORD:}
servisimibul.admin-bootstrap.second-email=${SB_ADMIN_2_EMAIL:}
servisimibul.admin-bootstrap.second-password=${SB_ADMIN_2_PASSWORD:}

# Local disposable demo only. The runner also verifies the test-harness database marker.
servisimibul.demo-parent-bootstrap.enabled=${SB_DEMO_PARENT_BOOTSTRAP_ENABLED:false}
servisimibul.demo-parent-bootstrap.disposable=${SB_TEST_DB_DISPOSABLE:false}
servisimibul.demo-parent-bootstrap.email=${SB_DEMO_PARENT_EMAIL:}
servisimibul.demo-parent-bootstrap.password=${SB_DEMO_PARENT_PASSWORD:}
