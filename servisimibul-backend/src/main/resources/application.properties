spring.application.name=servisimibul-backend
spring.datasource.url=${SB_DB_JDBC_URL}
spring.datasource.username=${SB_DB_USER}
spring.datasource.password=${SB_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Runtime starts without migration credentials. Enable Flyway only for a controlled migration run.
spring.flyway.enabled=${SB_FLYWAY_ENABLED:false}
spring.flyway.url=${SB_DB_MIGRATION_JDBC_URL:${SB_DB_JDBC_URL}}
spring.flyway.user=${SB_DB_MIGRATION_USER:}
spring.flyway.password=${SB_DB_MIGRATION_PASSWORD:}

# Session cookie defaults are secure. The explicit local profile is the only HTTP exception.
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SBSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SB_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# Expose only status-only health probes. All diagnostic/configuration endpoints stay unavailable.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Keep JMX and verbose request logging off so configuration and credentials cannot become diagnostics.
spring.jmx.enabled=false
spring.mvc.log-request-details=false
