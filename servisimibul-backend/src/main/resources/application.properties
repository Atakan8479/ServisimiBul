spring.application.name=servisimibul-backend
spring.datasource.url=${SB_DB_JDBC_URL}
spring.datasource.username=${SB_DB_USER}
spring.datasource.password=${SB_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Server-side session schema is owned by Flyway V4.
spring.session.jdbc.initialize-schema=never

# Runtime starts without migration credentials. Enable Flyway only for a controlled migration run.
spring.flyway.enabled=${SB_FLYWAY_ENABLED:false}
spring.flyway.url=${SB_DB_MIGRATION_JDBC_URL:${SB_DB_JDBC_URL}}
spring.flyway.user=${SB_DB_MIGRATION_USER:}
spring.flyway.password=${SB_DB_MIGRATION_PASSWORD:}

# Session cookie defaults are secure. The explicit local profile is the only HTTP exception.
spring.session.timeout=30m
server.servlet.session.cookie.name=SBSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SB_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# Expose only status-only health probes. All diagnostic/configuration endpoints stay unavailable.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# Keep JMX and verbose request logging off so configuration and credentials cannot become diagnostics.
spring.jmx.enabled=false
spring.mvc.log-request-details=false

# SMTP delivery is disabled until all SB_MAIL_* settings are deliberately configured.
servisimibul.email.enabled=${SB_MAIL_ENABLED:false}
servisimibul.email.from=${SB_MAIL_FROM:}
servisimibul.email.frontend-base-url=${SB_FRONTEND_BASE_URL:http://localhost:3000}
spring.mail.host=${SB_MAIL_HOST:localhost}
spring.mail.port=${SB_MAIL_PORT:587}
spring.mail.username=${SB_MAIL_USERNAME:}
spring.mail.password=${SB_MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${SB_MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SB_MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

# Official tariff files are disabled until a backend-only persistent directory is configured.
servisimibul.tariff.storage-dir=${SB_TARIFF_STORAGE_DIR:}

# One-shot admin bootstrap; run with web-application-type=none and temporary credentials.
servisimibul.admin-bootstrap.enabled=${SB_ADMIN_BOOTSTRAP_ENABLED:false}
servisimibul.admin-bootstrap.first-email=${SB_ADMIN_1_EMAIL:}
servisimibul.admin-bootstrap.first-password=${SB_ADMIN_1_PASSWORD:}
servisimibul.admin-bootstrap.second-email=${SB_ADMIN_2_EMAIL:}
servisimibul.admin-bootstrap.second-password=${SB_ADMIN_2_PASSWORD:}
