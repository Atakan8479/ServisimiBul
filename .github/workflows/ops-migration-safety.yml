name: OPS-01 migration safety

on:
  pull_request:
    paths:
      - "scripts/migrate-supabase.ps1"
      - "scripts/SupabaseMigrationSupport.ps1"
      - "scripts/SupabaseReleaseReadinessSupport.ps1"
      - "scripts/SupabaseWriterObservationSupport.ps1"
      - "scripts/Test-SupabaseWriterObservation*.ps1"
      - "scripts/Test-SupabaseMigration*.ps1"
      - "scripts/Test-SupabaseReleaseReadiness*.ps1"
      - "scripts/Invoke-SupabaseV15ReadinessRehearsal.ps1"
      - "scripts/LocalSupabaseSnapshotSupport.ps1"
      - "scripts/Test-LocalSupabaseSnapshot.Tests.ps1"
      - "dev-snapshot.ps1"
      - "scripts/ops_github_approval.py"
      - "scripts/test_ops_github_approval.py"
      - "scripts/ops_disposable_lock_coordinator.py"
      - "scripts/test_ops_disposable_lock_coordinator.py"
      - "scripts/ops_recovery_coverage.py"
      - "scripts/test_ops_recovery_coverage.py"
      - "scripts/ops_project_recovery_assessment.py"
      - "scripts/test_ops_project_recovery_assessment.py"
      - ".github/workflows/ops-independent-approval-audit.yml"
      - ".github/workflows/ops-migration-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-safety:
    name: OPS-01 Windows PowerShell safety
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Windows PowerShell 5.1 offline tests
        shell: powershell
        run: |
          ./scripts/Test-SupabaseMigration.Tests.ps1
          ./scripts/Test-SupabaseReleaseReadiness.Tests.ps1
          ./scripts/Test-SupabaseWriterObservation.Tests.ps1
          ./scripts/Test-LocalSupabaseSnapshot.Tests.ps1
      - name: Independent approval offline tests
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_ops_github_approval.py
          python -m unittest discover -s scripts -p test_ops_disposable_lock_coordinator.py
          python -m unittest discover -s scripts -p test_ops_recovery_coverage.py
          python -m unittest discover -s scripts -p test_ops_project_recovery_assessment.py
      - name: PowerShell 7 offline tests
        shell: pwsh
        run: ./scripts/Test-SupabaseMigration.Tests.ps1
