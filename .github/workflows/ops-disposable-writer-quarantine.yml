name: OPS-01 disposable runtime writer quarantine

on:
  pull_request:
    paths:
      - "scripts/ops_disposable_writer_quarantine.py"
      - "scripts/test_ops_disposable_writer_quarantine.py"
      - ".github/workflows/ops-disposable-writer-quarantine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated-only-ci
          POSTGRES_DB: ops01_freeze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ops01_freeze_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.10"
      - name: Provision isolated role and marker
        env:
          PGPASSWORD: isolated-only-ci
        run: |
          psql -h 127.0.0.1 -U postgres -d ops01_freeze_test -v ON_ERROR_STOP=1 -c "CREATE ROLE servisimibul_app LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS; CREATE SCHEMA test_harness; CREATE TABLE test_harness.database_instance(instance_id text PRIMARY KEY); INSERT INTO test_harness.database_instance VALUES ('ops01_disposable_abcd1234');"
      - name: Reject external targets and prove local quarantine
        env:
          SB_QUARANTINE_DSN: "enabled"
          SB_QUARANTINE_PORT: "5432"
          PGPASSWORD: isolated-only-ci
        run: python -m unittest discover -s scripts -p test_ops_disposable_writer_quarantine.py -v
