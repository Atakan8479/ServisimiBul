name: Backend

on:
  pull_request:
    paths:
      - "servisimibul-backend/**"
      - "docs/10_MIGRATION_VERIFICATION.sql"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "servisimibul-backend/**"
      - "docs/10_MIGRATION_VERIFICATION.sql"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: servisimibul-backend/pom.xml
      - name: Provision test database roles
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE servisimibul_app LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;"
      - name: Test backend
        working-directory: servisimibul-backend
        env:
          SB_DB_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
          SB_DB_USER: servisimibul_app
          SB_DB_PASSWORD: test-only
          SB_FLYWAY_ENABLED: "true"
          SB_DB_MIGRATION_JDBC_URL: jdbc:postgresql://localhost:5432/postgres
          SB_DB_MIGRATION_USER: postgres
          SB_DB_MIGRATION_PASSWORD: postgres
        run: ./mvnw --batch-mode verify
      - name: Verify migration operations query
        env:
          PGPASSWORD: postgres
        run: |
          output="$(psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 --file docs/10_MIGRATION_VERIFICATION.sql)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq '\|[[:space:]]*FAIL[[:space:]]*\|'; then
            echo 'Migration verification reported a failed check.' >&2
            exit 1
          fi
          pass_count="$(printf '%s\n' "$output" | grep -Ec '\|[[:space:]]*PASS[[:space:]]*\|')"
          if [ "$pass_count" -ne 13 ]; then
            echo "Expected 13 passing migration checks, found $pass_count." >&2
            exit 1
          fi
