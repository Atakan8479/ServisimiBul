name: Backend

on:
  # Main protection requires this check on every pull request. Keep this
  # unfiltered so documentation-only and repository-only changes cannot leave
  # the required check pending forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - "servisimibul-backend/**"
      - "scripts/Test-BackendDeploymentSmoke*.ps1"
      - "docs/07_BACKEND_DEPLOYMENT.md"
      - "docs/10_MIGRATION_VERIFICATION.sql"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  test:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: servisimibul-backend/pom.xml
      - name: Provision test database roles
        env:
          PGPASSWORD: postgres
          SB_TEST_DATABASE_NAME: servisimibul_ci
          SB_TEST_DB_INSTANCE_ID: gha_${{ github.run_id }}_${{ github.run_attempt }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE servisimibul_app LOGIN PASSWORD 'test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            CREATE ROLE anon NOLOGIN;
            CREATE ROLE authenticated NOLOGIN;"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE ${SB_TEST_DATABASE_NAME}"
          psql -h localhost -U postgres -d "${SB_TEST_DATABASE_NAME}" -v ON_ERROR_STOP=1 \
            -c "REVOKE CONNECT ON DATABASE ${SB_TEST_DATABASE_NAME} FROM PUBLIC;
            GRANT CONNECT ON DATABASE ${SB_TEST_DATABASE_NAME} TO servisimibul_app;
            CREATE SCHEMA test_harness;
            CREATE TABLE test_harness.database_instance (instance_id text PRIMARY KEY);
            INSERT INTO test_harness.database_instance VALUES ('${SB_TEST_DB_INSTANCE_ID}');
            REVOKE ALL ON SCHEMA test_harness FROM PUBLIC;
            REVOKE ALL ON ALL TABLES IN SCHEMA test_harness FROM PUBLIC;
            GRANT USAGE ON SCHEMA test_harness TO servisimibul_app;
            GRANT SELECT ON test_harness.database_instance TO servisimibul_app;"
      - name: Test backend
        working-directory: servisimibul-backend
        env:
          SB_TEST_DB_DISPOSABLE: "true"
          SB_TEST_DATABASE_NAME: servisimibul_ci
          SB_TEST_DB_INSTANCE_ID: gha_${{ github.run_id }}_${{ github.run_attempt }}
          SB_TEST_DB_ADMIN_JDBC_URL: jdbc:postgresql://localhost:5432/servisimibul_ci
          SB_TEST_DB_ADMIN_USER: postgres
          SB_TEST_DB_ADMIN_PASSWORD: postgres
          SB_DB_JDBC_URL: jdbc:postgresql://localhost:5432/servisimibul_ci
          SB_DB_USER: servisimibul_app
          SB_DB_PASSWORD: test-only
          SB_FLYWAY_ENABLED: "true"
          SPRING_FLYWAY_URL: jdbc:postgresql://localhost:5432/servisimibul_ci
          SPRING_FLYWAY_USER: postgres
          SPRING_FLYWAY_PASSWORD: postgres
        run: ./mvnw --batch-mode verify
      - name: Test deployment smoke script
        run: pwsh -NoProfile -File scripts/Test-BackendDeploymentSmoke.Tests.ps1
      - name: Verify migration operations query
        env:
          PGPASSWORD: postgres
        run: |
          output="$(psql -h localhost -U postgres -d servisimibul_ci -v ON_ERROR_STOP=1 --file docs/10_MIGRATION_VERIFICATION.sql)"
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -Eq '\|[[:space:]]*FAIL[[:space:]]*\|'; then
            echo 'Migration verification reported a failed check.' >&2
            exit 1
          fi
          pass_count="$(printf '%s\n' "$output" | grep -Ec '\|[[:space:]]*PASS[[:space:]]*\|')"
          if [ "$pass_count" -ne 13 ]; then
            echo "Expected 13 passing migration checks, found $pass_count." >&2
            exit 1
          fi
