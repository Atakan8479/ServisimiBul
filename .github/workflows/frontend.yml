name: Frontend

on:
  # Main protection requires this check on every pull request. Keep this
  # unfiltered so documentation-only and repository-only changes cannot leave
  # the required check pending forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - "servisimibul-frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  test:
    name: Frontend
    # Pinned: ubuntu-latest moved to 26.04, where Playwright's apt font
    # dependencies stalled the job past its timeout.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: servisimibul-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect documentation-only pull request
        id: changes
        shell: bash
        working-directory: .
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "run_frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_frontend=false
          changed=false
          while IFS= read -r -d '' file; do
            changed=true
            if [[ "$file" != *.md ]]; then
              run_frontend=true
              break
            fi
          done < <(git diff --no-renames --name-only -z \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")

          [[ "$changed" == true ]] || run_frontend=true
          echo "run_frontend=$run_frontend" >> "$GITHUB_OUTPUT"
      - name: Skip frontend execution for documentation-only change
        if: steps.changes.outputs.run_frontend == 'false'
        working-directory: .
        run: echo "Frontend execution skipped because every changed file is Markdown."
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.changes.outputs.run_frontend == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: servisimibul-frontend/package-lock.json
      - if: steps.changes.outputs.run_frontend == 'true'
        run: npm ci
      - if: steps.changes.outputs.run_frontend == 'true'
        run: npm run format:check
      - if: steps.changes.outputs.run_frontend == 'true'
        run: npm run lint
      - if: steps.changes.outputs.run_frontend == 'true'
        run: npm run typecheck
      - if: steps.changes.outputs.run_frontend == 'true'
        run: npm test
      - if: steps.changes.outputs.run_frontend == 'true'
        run: npm run build
      - name: Resolve Playwright version
        id: playwright
        if: steps.changes.outputs.run_frontend == 'true'
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Browser binaries are cached per Playwright version; OS packages are
      # still installed every run so a cache hit cannot hide a missing dependency.
      - name: Cache Playwright browsers
        id: playwright-cache
        if: steps.changes.outputs.run_frontend == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.changes.outputs.run_frontend == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changes.outputs.run_frontend == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - if: steps.changes.outputs.run_frontend == 'true'
        run: npm run test:e2e
