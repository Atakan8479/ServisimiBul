name: OPS-01 disposable lock integration

on:
  pull_request:
    paths:
      - "scripts/ops_disposable_lock_coordinator.py"
      - "scripts/test_ops_disposable_lock_coordinator.py"
      - ".github/workflows/ops-disposable-lock-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated-only-ci-password
          POSTGRES_DB: ops01_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ops01_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install isolated CI driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]==3.2.10"
      - name: Test lock collision and session-release semantics
        env:
          PGPASSWORD: isolated-only-ci-password
          SB_LOCK_TEST_DSN: postgresql://postgres@127.0.0.1:5432/ops01_test?sslmode=disable
          SB_LOCK_TEST_PORT: "5432"
          SB_LOCK_TEST_DATABASE: ops01_test
          SB_LOCK_TEST_USER: postgres
        run: |
          export SB_LOCK_TEST_SYSTEM_ID="$(python -c 'import os,psycopg; c=psycopg.connect(os.environ["SB_LOCK_TEST_DSN"],password=os.environ["PGPASSWORD"]); print(c.execute("select system_identifier::text from pg_control_system()").fetchone()[0]); c.close()')"
          python -m unittest discover -s scripts -p test_ops_disposable_lock_coordinator.py -v
